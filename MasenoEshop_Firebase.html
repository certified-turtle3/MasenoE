<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Maseno eShop</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Fraunces:wght@700;800;900&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --g:#15803d;--gl:#16a34a;--gll:#4ade80;--gd:#052e16;
  --gold:#d97706;--gold-l:#f59e0b;
  --red:#dc2626;--red-l:#ef4444;
  --bg:#030712;--bgc:#0c1018;--bg2:#111827;--bg3:#1a2233;
  --bd:#1e2d40;--bdl:#2a3f57;--bds:#0f1e2e;
  --t1:#f0f6ff;--t2:#94a3b8;--t3:#475569;
  --r:14px;--rs:8px;--rl:20px;
  --ff:'DM Sans',sans-serif;--fd:'Fraunces',serif;
}
body{font-family:var(--ff);background:var(--bg);color:var(--t1);min-height:100vh;font-size:14px;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{cursor:pointer;font-family:inherit;border:none;background:none}
input,textarea,select{font-family:inherit;font-size:13px;color:var(--t1);background:var(--bg2);border:1px solid var(--bd);border-radius:var(--rs);padding:10px 12px;width:100%;outline:none;transition:all .2s}
input:focus,textarea:focus,select:focus{border-color:var(--gl);background:var(--bg3);box-shadow:0 0 0 3px rgba(22,163,74,.12)}
input::placeholder,textarea::placeholder{color:var(--t3)}
select option{background:var(--bgc)}
img{display:block;max-width:100%}
.hidden{display:none!important}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bdl);border-radius:2px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;border-radius:var(--rs);font-size:13px;font-weight:600;border:1px solid transparent;white-space:nowrap;transition:all .2s;letter-spacing:.01em}
.btn-p{background:var(--gl);color:#fff}.btn-p:hover{background:var(--g);transform:translateY(-1px)}
.btn-s{background:transparent;color:var(--gll);border-color:var(--gl)}.btn-s:hover{background:rgba(22,163,74,.1)}
.btn-g{background:transparent;color:var(--t2);border-color:var(--bd)}.btn-g:hover{color:var(--t1);background:var(--bg2)}
.btn-d{background:var(--red);color:#fff}.btn-d:hover{background:var(--red-l)}
.btn-gold{background:var(--gold);color:#fff;font-weight:700}.btn-gold:hover{background:var(--gold-l)}
.btn-f{width:100%}.btn-sm{padding:6px 12px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important}

/* LAYOUT */
.card{background:var(--bgc);border:1px solid var(--bd);border-radius:var(--r);padding:18px}
.fg{margin-bottom:14px}
.lbl{display:block;margin-bottom:5px;font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.06em}
.hint{color:var(--t3);font-size:11px;margin-top:4px}
.err-box{color:#fca5a5;font-size:12px;margin-bottom:12px;padding:10px 12px;background:rgba(220,38,38,.1);border:1px solid rgba(220,38,38,.3);border-radius:var(--rs)}

/* BADGES */
.badge{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 9px;border-radius:999px}
.b-student{background:rgba(74,222,128,.15);color:var(--gll)}
.b-business{background:rgba(245,158,11,.15);color:var(--gold-l)}
.b-mama_fua{background:rgba(167,139,250,.15);color:#a78bfa}
.b-selling{background:var(--gl);color:#fff}
.b-wanted{background:var(--gold);color:#fff}

/* NAV */
#nav{position:fixed;top:0;left:0;right:0;z-index:300;height:56px;background:rgba(3,7,18,.88);backdrop-filter:blur(16px);border-bottom:1px solid var(--bd)}
.nav-in{height:100%;padding:0 16px;display:flex;align-items:center;gap:10px;max-width:1100px;margin:0 auto}
.logo{font-family:var(--fd);font-size:18px;font-weight:900;flex-shrink:0;display:flex;align-items:center;gap:6px;letter-spacing:-.02em}
.logo-dot{color:var(--gll)}
.logo-tag{font-family:var(--ff);font-size:9px;font-weight:700;background:var(--gold);color:#fff;padding:2px 6px;border-radius:4px;letter-spacing:.06em;text-transform:uppercase}
.nav-links{display:flex;align-items:center;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none}
.nav-links::-webkit-scrollbar{display:none}
.nl{padding:6px 12px;border-radius:var(--rs);font-size:12px;font-weight:600;color:var(--t2);transition:all .2s;white-space:nowrap;border:none;background:none;cursor:pointer}
.nl:hover,.nl.active{color:var(--t1);background:var(--bg2)}
.nl-post{background:var(--gl)!important;color:#fff!important;border-radius:var(--rs)}
.nl-post:hover{background:var(--g)!important}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-shrink:0}
.av-btn{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--gl),var(--g));color:#fff;font-weight:700;font-size:12px;border:2px solid var(--gll);flex-shrink:0;transition:.2s}
.av-btn:hover{transform:scale(1.05)}
.av-wrap{position:relative}
.av-dd{position:absolute;top:calc(100% + 8px);right:0;background:var(--bgc);border:1px solid var(--bd);border-radius:var(--r);min-width:160px;box-shadow:0 12px 32px rgba(0,0,0,.6);overflow:hidden;z-index:400}
.av-dd button{display:block;width:100%;padding:11px 16px;font-size:12px;color:var(--t2);text-align:left;transition:.15s}
.av-dd button:hover{background:var(--bg2);color:var(--t1)}
.av-dd hr{border:none;border-top:1px solid var(--bd);margin:4px 0}

/* MAIN */
#app{padding-top:56px;min-height:100vh}
.page{max-width:900px;margin:0 auto;padding:18px 16px}
.page-sm{max-width:440px;margin:0 auto;padding:20px 16px}

/* HERO */
.hero{background:linear-gradient(160deg,#051a0d 0%,var(--bg) 55%);border-bottom:1px solid var(--bd);padding:44px 16px 32px;text-align:center;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% -10%,rgba(22,163,74,.18) 0%,transparent 65%);pointer-events:none}
.hero-in{position:relative;z-index:1;max-width:600px;margin:0 auto}
.hero h1{font-family:var(--fd);font-size:clamp(26px,7vw,48px);font-weight:900;line-height:1.05;margin-bottom:12px;letter-spacing:-.03em}
.hero h1 em{font-style:normal;color:var(--gll)}
.hero p{color:var(--t2);font-size:14px;margin-bottom:22px;line-height:1.6}
.hero-cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* FILTERS */
.filters-wrap{background:var(--bgc);border-bottom:1px solid var(--bd);position:sticky;top:56px;z-index:100}
.filters{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;scrollbar-width:none;max-width:900px;margin:0 auto}
.filters::-webkit-scrollbar{display:none}
.fbtn{padding:5px 13px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--bd);color:var(--t2);white-space:nowrap;background:transparent;cursor:pointer;transition:all .2s}
.fbtn.active,.fbtn:hover{background:var(--gl);color:#fff;border-color:var(--gl)}
.search-row{display:flex;gap:8px;padding:10px 16px;max-width:900px;margin:0 auto;border-bottom:1px solid var(--bd)}

/* FEED */
.feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;padding:16px;max-width:900px;margin:0 auto}
.pcard{background:var(--bgc);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:all .25s}
.pcard:hover{border-color:var(--gl);transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,.5)}
.pcard-img{aspect-ratio:16/9;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:3rem;position:relative;overflow:hidden}
.pcard-img img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.pcard:hover .pcard-img img{transform:scale(1.04)}
.type-pill{position:absolute;top:8px;left:8px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 9px;border-radius:999px;backdrop-filter:blur(6px)}
.pcard-body{padding:12px;flex:1;display:flex;flex-direction:column;gap:4px}
.pcard-title{font-size:13px;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pcard-desc{font-size:11px;color:var(--t2);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;flex:1;line-height:1.5}
.pcard-price{font-size:14px;font-weight:700;color:var(--gold-l)}
.pcard-foot{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-top:1px solid var(--bd);font-size:11px;color:var(--t3)}
.act-btn{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--t3);background:none;border:none;cursor:pointer;padding:3px 6px;border-radius:6px;transition:all .15s}
.act-btn:hover{color:var(--gll);background:rgba(74,222,128,.08)}
.act-btn.liked{color:var(--red-l)}
.act-btn.liked:hover{color:var(--red-l);background:rgba(220,38,38,.1)}
.mini-av{width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,var(--gl),var(--g));color:#fff;font-size:8px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* DETAIL */
.detail-img{border-radius:var(--r);overflow:hidden;background:var(--bgc);border:1px solid var(--bd);height:240px;display:flex;align-items:center;justify-content:center;font-size:5rem;margin-bottom:16px}
.detail-img img{width:100%;height:100%;object-fit:cover}
.contact-card{background:linear-gradient(135deg,rgba(5,46,22,.8),var(--bgc));border:1px solid var(--gl);border-radius:var(--r);padding:16px;margin:14px 0}
.cmt{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.cmt-av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--gl),var(--g));color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cmt-author{font-size:12px;font-weight:600}
.cmt-time{font-size:10px;color:var(--t3);margin-left:6px}
.cmt-text{font-size:12px;color:var(--t2);margin-top:3px;line-height:1.5}

/* MAMA FUA */
.mf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.mf-card{background:var(--bgc);border:1px solid var(--bd);border-radius:var(--r);padding:16px;transition:all .25s}
.mf-card.avail{border-color:var(--gl);box-shadow:0 0 20px rgba(22,163,74,.08)}
.mf-card:hover{transform:translateY(-2px)}
.mf-av{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--gl),var(--g));color:#fff;font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ab{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;padding:2px 8px;border-radius:999px}
.ab::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}
.ab-on{background:rgba(74,222,128,.15);color:var(--gll)}
.ab-off{background:rgba(71,85,105,.3);color:var(--t3)}
.mf-pricing{background:rgba(217,119,6,.08);border:1px solid rgba(217,119,6,.25);border-radius:var(--rs);padding:8px 10px;font-size:11px;margin:8px 0;line-height:1.5}

/* TOGGLE */
.toggle{width:46px;height:24px;background:var(--bdl);border-radius:999px;position:relative;cursor:pointer;transition:background .25s;flex-shrink:0}
.toggle.on{background:var(--gl)}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;background:#fff;border-radius:50%;transition:transform .25s;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.toggle.on::after{transform:translateX(22px)}

/* AUTH */
.auth-page{min-height:calc(100vh - 56px);display:flex;align-items:center;justify-content:center;padding:24px 16px;background:radial-gradient(ellipse at 50% 0%,rgba(22,163,74,.06) 0%,transparent 60%)}
.auth-card{background:var(--bgc);border:1px solid var(--bd);border-radius:var(--rl);padding:28px;width:100%;max-width:400px}
.auth-card h2{font-family:var(--fd);font-size:24px;font-weight:900;margin-bottom:5px;letter-spacing:-.02em}
.auth-card p{color:var(--t2);font-size:13px;margin-bottom:22px;line-height:1.5}
.auth-sw{text-align:center;margin-top:18px;font-size:12px;color:var(--t2)}
.auth-sw span{color:var(--gll);font-weight:600;cursor:pointer}
.auth-sw span:hover{text-decoration:underline}

/* PROFILE */
.prof-head{background:linear-gradient(135deg,rgba(5,46,22,.6),var(--bgc));border:1px solid var(--bd);border-radius:var(--r);padding:20px;display:flex;align-items:center;gap:16px;margin-bottom:16px}
.prof-av{width:68px;height:68px;border-radius:50%;background:linear-gradient(135deg,var(--gl),var(--g));color:#fff;font-weight:900;font-size:24px;display:flex;align-items:center;justify-content:center;border:2px solid var(--gll);flex-shrink:0;font-family:var(--fd)}
.tabs-bar{display:flex;border-bottom:1px solid var(--bd);margin-bottom:18px;gap:2px}
.tab{padding:9px 16px;font-size:12px;font-weight:600;color:var(--t3);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;transition:all .2s;border-radius:var(--rs) var(--rs) 0 0}
.tab:hover{color:var(--t2);background:rgba(255,255,255,.03)}
.tab.active{color:var(--gll);border-bottom-color:var(--gl)}
.avail-row{display:flex;align-items:center;justify-content:space-between;background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);padding:14px 16px;margin-bottom:16px}

/* PAYMENT MODAL */
.pm-overlay{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.82);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px}
.pm-box{background:var(--bgc);border:1px solid var(--bd);border-radius:var(--rl);padding:24px;width:100%;max-width:340px;position:relative}
.pm-close{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:50%;background:var(--bg2);color:var(--t2);font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;transition:.2s}
.pm-close:hover{background:var(--red);color:#fff}
.pm-amt{font-family:var(--fd);font-size:48px;font-weight:900;color:var(--gll);text-align:center;margin:10px 0;letter-spacing:-.03em}
.pm-step{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd);font-size:12px;color:var(--t2);line-height:1.5}
.snum{min-width:22px;height:22px;border-radius:50%;background:var(--gl);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}

/* STATUS */
.loader{width:36px;height:36px;border:3px solid var(--bd);border-top-color:var(--gll);border-radius:50%;animation:spin .7s linear infinite;margin:3rem auto}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:48px 16px;color:var(--t3)}
.empty-icon{font-size:3.5rem;margin-bottom:12px}
.empty h3{font-size:15px;color:var(--t2);margin-bottom:6px}
.back-btn{color:var(--t2);font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;margin-bottom:16px;padding:6px 0;background:none;border:none;transition:color .2s}
.back-btn:hover{color:var(--t1)}

/* TOASTS */
.toast-wrap{position:fixed;bottom:20px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;max-width:300px}
.toast{display:flex;align-items:center;gap:8px;background:var(--bgc);border:1px solid var(--bd);border-radius:var(--rs);padding:11px 14px;font-size:12px;box-shadow:0 8px 32px rgba(0,0,0,.6);animation:tin .25s ease}
.toast.ok{border-left:3px solid var(--gll)}.toast.er{border-left:3px solid var(--red-l)}.toast.inf{border-left:3px solid var(--gold-l)}
@keyframes tin{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}

/* STARS */
.stars-row{display:flex;gap:6px;margin-bottom:10px}
.star{font-size:24px;cursor:pointer;color:var(--t3);transition:.15s;line-height:1}
.star.on{color:var(--gold-l)}

/* SETUP SCREEN */
.setup-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(ellipse at 50% 30%,rgba(22,163,74,.1),transparent 60%)}
.setup-card{background:var(--bgc);border:1px solid var(--bd);border-radius:var(--rl);padding:32px;max-width:520px;width:100%}
.setup-card h1{font-family:var(--fd);font-size:28px;font-weight:900;letter-spacing:-.02em;margin-bottom:8px}
.setup-card h1 span{color:var(--gll)}
.step-indicator{display:flex;gap:8px;margin-bottom:28px}
.step-dot{width:8px;height:8px;border-radius:50%;background:var(--bd);transition:.3s}
.step-dot.done{background:var(--gl)}
.step-dot.active{background:var(--gll);width:24px;border-radius:4px}
.code-block{background:var(--bg);border:1px solid var(--bd);border-radius:var(--rs);padding:12px 14px;font-family:monospace;font-size:12px;color:var(--gll);margin:10px 0;word-break:break-all;line-height:1.6}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

@media(max-width:600px){
  .feed{grid-template-columns:1fr}
  .mf-grid{grid-template-columns:1fr}
  .field-row{grid-template-columns:1fr}
  .hero h1{font-size:28px}
  .auth-card{padding:20px}
}
</style>
</head>
<body>

<div class="toast-wrap" id="toasts"></div>

<!-- NAV -->
<nav id="nav">
  <div class="nav-in">
    <div class="logo">Maseno<span class="logo-dot">.</span><span class="logo-tag">eShop</span></div>
    <div class="nav-links" id="navLinks">
      <button class="nl active" data-pg="feed">Feed</button>
      <button class="nl" data-pg="mama">🧺 Mama Fua</button>
      <button class="nl nl-post" data-pg="post">+ Post Ad</button>
    </div>
    <div class="nav-right">
      <button class="btn btn-g btn-sm" id="loginNavBtn">Login</button>
      <button class="btn btn-p btn-sm" id="joinNavBtn">Join</button>
      <div class="av-wrap hidden" id="avWrap">
        <button class="av-btn" id="avBtn"></button>
        <div class="av-dd hidden" id="avDd">
          <button onclick="go('profile')">My Profile</button>
          <button onclick="go('myposts')">My Posts</button>
          <hr/>
          <button id="logoutBtn">Logout</button>
        </div>
      </div>
    </div>
  </div>
</nav>

<main id="app"><div class="loader"></div></main>

<!-- FIREBASE SETUP WIZARD (shown if not configured) -->
<div id="setupScreen" class="setup-screen hidden">
  <div class="setup-card">
    <h1>Connect to <span>Firebase</span></h1>
    <p style="color:var(--t2);font-size:13px;margin-bottom:20px">One-time setup — takes about 5 minutes. You only do this once.</p>
    <div class="step-indicator">
      <div class="step-dot active" id="sd1"></div>
      <div class="step-dot" id="sd2"></div>
      <div class="step-dot" id="sd3"></div>
    </div>
    <div id="setupContent"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getDatabase, ref, push, set, get, onValue, update, remove, query, orderByChild, limitToLast } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

// ===== FIREBASE CONFIG =====
// Loaded from localStorage after setup wizard
let firebaseConfig = null;
let app, db, auth;
let currentUser = null;
let _detailId = null;

const STORAGE_KEY = 'maseno_fb_config';

// ===== HELPERS =====
const uid = () => Math.random().toString(36).slice(2);
const ini = n => (n||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
const fmtP = p => p && /^\d+$/.test(p.trim()) ? 'KES ' + parseInt(p).toLocaleString() : p || '';
const ago = d => { const m = Math.floor((Date.now() - new Date(d)) / 60000); return m<1?'now':m<60?m+'m':m<1440?Math.floor(m/60)+'h':new Date(d).toLocaleDateString('en-KE',{day:'numeric',month:'short'}); };
const emo = {electronics:'💻',food:'🍔',clothes:'👗',books:'📚',services:'🛠️',transport:'🚌',household:'🏠',other:'📦'};

function toast(msg, type='inf', ms=4000) {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<span>${{ok:'✅',er:'❌',inf:'ℹ️'}[type]||'ℹ️'}</span><span style="flex:1">${msg}</span>`;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), ms);
}

// ===== SETUP WIZARD =====
function showSetup() {
  document.getElementById('app').innerHTML = '';
  document.getElementById('setupScreen').classList.remove('hidden');
  renderSetupStep(1);
}

function renderSetupStep(step) {

// ===== INIT FIREBASE =====
async function initFirebase() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (!saved) { showSetup(); return; }
  try {
    firebaseConfig = JSON.parse(saved);
    app = initializeApp(firebaseConfig);
    db = getDatabase(app);
    auth = getAuth(app);
    onAuthStateChanged(auth, user => {
      currentUser = user;
      updateNav();
      if (document.getElementById('app').innerHTML.includes('loader') || !document.getElementById('app').innerHTML.trim()) {
        go('feed');
      }
    });
    document.getElementById('app').innerHTML = '<div class="loader"></div>';
  } catch(e) {
    localStorage.removeItem(STORAGE_KEY);
    toast('Firebase config error. Please reconfigure.','er');
    showSetup();
  }
}

document.getElementById('joinNavBtn').onclick = () => go('register');

  await signOut(auth); updateNav();

window.go = function(pg) {
  document.querySelectorAll('.nl').forEach(b => b.classList.toggle('active', b.dataset.pg === pg));
  const app = document.getElementById('app');
  if (pg === 'feed') renderFeed(app);
  else if (pg === 'mama') renderMama(app);
  else if (pg === 'post') { if (!currentUser) { toast('Login first','inf'); go('login'); return; } renderPost(app); }
  else if (pg === 'login') renderLogin(app);
  else if (pg === 'register') renderRegister(app);
  else if (pg === 'profile') renderProfile(app);
  else if (pg === 'myposts') renderMyPosts(app);
  else if (pg === 'detail') renderDetail(app);
};

// ===== PAYMENT CHECK =====
async function canPost() {
  if (!currentUser) return false;
  const snap = await get(ref(db, `users/${currentUser.uid}/role`));
  const role = snap.val();
  if (role === 'mama_fua' || role === 'admin') return true;
  const paySnap = await get(ref(db, `payments/${currentUser.uid}/expires`));
  if (!paySnap.exists()) return false;
  return new Date(paySnap.val()) > new Date();
}

async function getRole() {
  if (!currentUser) return null;
  const snap = await get(ref(db, `users/${currentUser.uid}/role`));
  return snap.val();
}

// ===== FEED =====
function renderFeed(app) {
  let typeF = '', catF = '', search = '';
  let unsubscribe = null;

  function draw(posts) {
    const filtered = (posts || []).filter(p => {
      if (typeF && p.type !== typeF) return false;
      if (catF && p.category !== catF) return false;
      if (search && !p.title?.toLowerCase().includes(search.toLowerCase()) && !p.desc?.toLowerCase().includes(search.toLowerCase())) return false;
      return true;
    });

    const grid = document.getElementById('feedGrid');
    if (!grid) return;

    if (!filtered.length) {
      grid.innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="empty-icon">📭</div><h3>No posts yet</h3><p>Be the first to post something!</p></div>`;
      return;
    }

    grid.innerHTML = filtered.map(p => {
      const likeCount = p.likes ? Object.keys(p.likes).length : 0;
      const cmtCount = p.comments ? Object.keys(p.comments).length : 0;
      const liked = currentUser && p.likes && p.likes[currentUser.uid];
      return `<div class="pcard" data-pid="${p.id}">
        <div class="pcard-img">
          ${p.img ? `<img src="${p.img}" alt="" loading="lazy" onerror="this.style.display='none'"/>` : `<span>${emo[p.category]||'📦'}</span>`}
          <span class="type-pill b-${p.type}">${p.type==='selling'?'🏪 Selling':'🔍 Wanted'}</span>
        </div>
        <div class="pcard-body">
          <div class="pcard-title">${p.title||''}</div>
          <div class="pcard-desc">${p.desc||''}</div>
          ${p.price ? `<div class="pcard-price">${fmtP(p.price)}</div>` : ''}
        </div>
        <div class="pcard-foot">
          <div style="display:flex;align-items:center;gap:5px;min-width:0"><div class="mini-av">${ini(p.authorName)}</div><span style="overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:70px">${p.authorName||''}</span></div>
          <div style="display:flex;gap:4px">
            <button class="act-btn ${liked?'liked':''}" data-like="${p.id}">♥ ${likeCount}</button>
            <span class="act-btn">💬 ${cmtCount}</span>
          </div>
          <span>${ago(p.created)}</span>
        </div>
      </div>`;
    }).join('');

    document.getElementById('feedGrid').addEventListener('click', e => {
      const like = e.target.closest('[data-like]');
      const card = e.target.closest('.pcard');
      if (like) {
        e.stopPropagation();
        if (!currentUser) { toast('Login to like','inf'); return; }
        const pid = like.dataset.like;
        const likePath = ref(db, `posts/${pid}/likes/${currentUser.uid}`);
        get(likePath).then(snap => {
          if (snap.exists()) remove(likePath); else set(likePath, true);
        });
        return;
      }
      if (card) { _detailId = card.dataset.pid; go('detail'); }
    }, { once: true });
  }

  app.innerHTML = `
    <div class="hero">
      <div class="hero-in">
        <h1>Maseno's <em>Marketplace</em></h1>
        <p>Buy, sell & find services — right here at Maseno University</p>
        <div class="hero-cta">
          <button class="btn btn-p" onclick="go('post')" style="font-size:14px;padding:11px 24px">+ Post Ad</button>
          <button class="btn btn-g" onclick="go('mama')" style="font-size:14px;padding:11px 24px">🧺 Mama Fua</button>
        </div>
      </div>
    </div>
    <div class="filters-wrap">
      <div class="search-row">
        <input id="si" type="text" placeholder="🔍 Search products, services..." value="${search}"/>
        <button class="btn btn-s btn-sm" id="sb">Search</button>
      </div>
      <div class="filters" id="fbar">
        <button class="fbtn ${!typeF?'active':''}" data-tf="">All</button>
        <button class="fbtn ${typeF==='selling'?'active':''}" data-tf="selling">🏪 Selling</button>
        <button class="fbtn ${typeF==='wanted'?'active':''}" data-tf="wanted">🔍 Wanted</button>
        <span style="width:1px;background:var(--bd);align-self:center;height:18px;margin:0 2px"></span>
        ${['electronics','food','clothes','books','services'].map(c=>`<button class="fbtn ${catF===c?'active':''}" data-cf="${c}">${emo[c]} ${c[0].toUpperCase()+c.slice(1)}</button>`).join('')}
      </div>
    </div>
    <div class="feed" id="feedGrid"><div class="loader" style="grid-column:1/-1"></div></div>`;

  // Live listener
  const postsRef = ref(db, 'posts');
  unsubscribe = onValue(postsRef, snap => {
    const data = snap.val() || {};
    const posts = Object.entries(data).map(([id,p])=>({...p,id})).reverse();
    draw(posts);
  });

  document.getElementById('fbar').addEventListener('click', e => {
    const b = e.target.closest('[data-tf],[data-cf]'); if (!b) return;
    if ('tf' in b.dataset) typeF = b.dataset.tf;
    if ('cf' in b.dataset) catF = catF === b.dataset.cf ? '' : b.dataset.cf;
    // Re-fetch and redraw
    get(ref(db,'posts')).then(snap => {
      const data = snap.val()||{}; const posts = Object.entries(data).map(([id,p])=>({...p,id})).reverse();
      document.querySelectorAll('[data-tf]').forEach(b2=>b2.classList.toggle('active',b2.dataset.tf===typeF));
      document.querySelectorAll('[data-cf]').forEach(b2=>b2.classList.toggle('active',b2.dataset.cf===catF));
      draw(posts);
    });
  });
  document.getElementById('sb').onclick = () => {
    search = document.getElementById('si').value;
    get(ref(db,'posts')).then(snap => { const data=snap.val()||{}; draw(Object.entries(data).map(([id,p])=>({...p,id})).reverse()); });
  };
  document.getElementById('si').onkeydown = e => { if(e.key==='Enter') document.getElementById('sb').click(); };
}

// ===== DETAIL =====
function renderDetail(app) {

  const pRef = ref(db, `posts/${_detailId}`);
  onValue(pRef, snap => {
    const p = snap.val(); if (!p) { go('feed'); return; }
    p.id = _detailId;
    const likeCount = p.likes ? Object.keys(p.likes).length : 0;
    const liked = currentUser && p.likes && p.likes[currentUser.uid];
    const cmts = p.comments ? Object.entries(p.comments).map(([id,c])=>({...c,id})) : [];

    app.innerHTML = `
      <div class="page">
        <button class="back-btn" onclick="go('feed')">← Back to feed</button>
        <div class="detail-img">${p.img?`<img src="${p.img}" alt="" onerror="this.parentElement.innerHTML='<span style=font-size:4rem>${emo[p.category]||'📦'}</span>'">`:`<span>${emo[p.category]||'📦'}</span>`}</div>
        <span class="badge b-${p.type}" style="margin-bottom:10px;display:inline-block">${p.type==='selling'?'🏪 For Sale':'🔍 Wanted'}</span>
        <h2 style="font-family:var(--fd);font-size:22px;font-weight:900;margin-bottom:6px;letter-spacing:-.02em">${p.title||''}</h2>
        ${p.price?`<div style="font-size:24px;font-weight:800;color:var(--gold-l);margin-bottom:10px;font-family:var(--fd)">${fmtP(p.price)}</div>`:''}
        <p style="color:var(--t2);font-size:13px;line-height:1.7;margin-bottom:14px">${p.desc||''}</p>
        <div class="contact-card">
          <div style="font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--t2);margin-bottom:6px">📞 How to Contact</div>
          <div style="font-weight:600;font-size:14px">${p.contact||''}</div>
        </div>
        <div style="display:flex;gap:8px;margin:14px 0">
          <button class="btn ${liked?'btn-d':'btn-s'} btn-f" id="likeBtn">${liked?'❤️ Liked':'🤍 Like'} (${likeCount})</button>
          ${currentUser && currentUser.uid===p.authorId?`<button class="btn btn-g btn-sm" id="delBtn">🗑️ Delete</button>`:''}
        </div>
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;padding:10px;background:var(--bg2);border-radius:var(--rs)">
          <div class="mini-av" style="width:34px;height:34px;font-size:11px">${ini(p.authorName)}</div>
          <div><div style="font-size:13px;font-weight:600">${p.authorName||''}</div><div style="font-size:11px;color:var(--t3)">${ago(p.created)} · ${p.views||0} views</div></div>
        </div>
        <div style="font-weight:600;font-size:13px;margin-bottom:12px">💬 Comments (${cmts.length})</div>
        <div id="cmtList">
          ${cmts.length?cmts.map(c=>`<div class="cmt"><div class="cmt-av">${ini(c.author)}</div><div><span class="cmt-author">${c.author}</span><span class="cmt-time">${ago(c.created)}</span><div class="cmt-text">${c.text}</div></div></div>`).join(''):'<p style="font-size:12px;color:var(--t3);margin-bottom:12px">No comments yet. Be the first!</p>'}
        </div>
        ${currentUser?`<div style="display:flex;gap:8px;margin-top:14px"><textarea id="cmtIn" style="height:68px;resize:none;flex:1" placeholder="Write a comment..."></textarea><button class="btn btn-p btn-sm" id="cmtBtn" style="align-self:flex-end">Post</button></div>`:`<p style="font-size:12px;color:var(--t3);margin-top:12px"><span style="color:var(--gll);cursor:pointer" onclick="go('login')">Login</span> to comment</p>`}
      </div>`;

    // Increment views
    update(ref(db,`posts/${_detailId}`),{views:(p.views||0)+1});

    document.getElementById('likeBtn')?.addEventListener('click',()=>{
      if(!currentUser){toast('Login to like','inf');return;}
      const lRef=ref(db,`posts/${_detailId}/likes/${currentUser.uid}`);
      get(lRef).then(s=>{if(s.exists())remove(lRef);else set(lRef,true);});
    });
    document.getElementById('delBtn')?.addEventListener('click',()=>{
      if(!confirm('Delete this post?'))return;
      remove(ref(db,`posts/${_detailId}`)).then(()=>{toast('Post deleted','ok');go('feed');});
    });
    document.getElementById('cmtBtn')?.addEventListener('click',()=>{
      const txt=document.getElementById('cmtIn').value.trim(); if(!txt)return;
      push(ref(db,`posts/${_detailId}/comments`),{author:currentUser.displayName||currentUser.email,authorId:currentUser.uid,text:txt,created:new Date().toISOString()});
      document.getElementById('cmtIn').value='';
    });
  },{onlyOnce:false});
}

            ${u.phone?`<a href="tel:${u.phone}" class="btn btn-p btn-sm">📞 Call</a><a href="https://wa.me/254${u.phone.replace(/^0|\+254|^254/,'')}" target="_blank" class="btn btn-g btn-sm">💬 WhatsApp</a>`:''}
            <button class="btn btn-s btn-sm" onclick="openRate('${u.id}','${(u.name||'').replace(/'/g,"\\'")}')">⭐ Rate</button>
          </div>
        </div>`).join('');
    });
  }

  loadMf();
  document.getElementById('allMf').onclick = () => { avOnly=false; document.getElementById('allMf').classList.add('active'); document.getElementById('availMf').classList.remove('active'); loadMf(); };
  document.getElementById('availMf').onclick = () => { avOnly=true; document.getElementById('availMf').classList.add('active'); document.getElementById('allMf').classList.remove('active'); loadMf(); };
}

window.openRate = function(userId, userName) {
  if(!currentUser){toast('Login to rate','inf');return;}
  if(currentUser.uid===userId){toast("Can't rate yourself",'inf');return;}
  let sel=0;
  const ov=document.createElement('div'); ov.className='pm-overlay';
  ov.innerHTML=`<div class="pm-box" style="max-width:320px">
    <button class="pm-close" id="rc">×</button>
    <h3 style="font-size:17px;font-family:var(--fd);margin-bottom:4px">Rate ${userName}</h3>
    <p style="font-size:12px;color:var(--t2);margin-bottom:14px">How was the service?</p>
    <div class="stars-row" id="sr">${[1,2,3,4,5].map(n=>`<span class="star" data-n="${n}">☆</span>`).join('')}</div>
    <textarea id="rv" style="height:70px;resize:none;margin-bottom:12px" placeholder="Write a review (optional)..."></textarea>
    <button class="btn btn-p btn-f" id="submitR">Submit Rating</button></div>`;
  document.body.appendChild(ov);
  document.getElementById('rc').onclick=()=>ov.remove();
  document.getElementById('sr').addEventListener('click',e=>{
    const s=e.target.closest('.star');if(!s)return;
    sel=parseInt(s.dataset.n);
    document.querySelectorAll('.star').forEach((el,i)=>{el.textContent=i<sel?'★':'☆';el.classList.toggle('on',i<sel);});
  });
  document.getElementById('submitR').onclick=async()=>{
    if(!sel){toast('Select stars first','inf');return;}
    const btn=document.getElementById('submitR');btn.disabled=true;btn.textContent='Submitting...';
    const mfSnap=await get(ref(db,`users/${userId}/mf`));
    const mf=mfSnap.val()||{rating:0,ratingCount:0};
    const cnt=mf.ratingCount||0;
    const newRating=((mf.rating||0)*cnt+sel)/(cnt+1);
    await update(ref(db,`users/${userId}/mf`),{rating:newRating,ratingCount:cnt+1});
    await set(ref(db,`ratings/${userId}/${currentUser.uid}`),{rating:sel,review:document.getElementById('rv').value,created:new Date().toISOString(),raterName:currentUser.displayName||currentUser.email});
    ov.remove();toast('Rating submitted ⭐','ok');renderMama(document.getElementById('app'));
  };
};

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <div class="fg"><label class="lbl">Post Type *</label>
            <select id="pt"><option value="selling">🏪 I'm Selling</option><option value="wanted">🔍 I'm Looking For</option></select></div>
          <div class="fg"><label class="lbl">Category *</label>
            <select id="pc"><option value="electronics">💻 Electronics</option><option value="food">🍔 Food</option><option value="clothes">👗 Clothes</option><option value="books">📚 Books</option><option value="services">🛠️ Services</option><option value="transport">🚌 Transport</option><option value="household">🏠 Household</option><option value="other">📦 Other</option></select></div>
        </div>

        <div class="fg"><label class="lbl">Description *</label><textarea id="pdesc" style="height:100px;resize:vertical" placeholder="Describe the product or what you need in detail..." maxlength="1000"></textarea></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <div class="fg"><label class="lbl">Price</label><input id="pprice" placeholder="e.g. 2500 or Negotiable"/></div>
          <div class="fg"><label class="lbl">Contact Info *</label><input id="pcontact" placeholder="Phone / WhatsApp"/></div>
        </div>
        <div class="fg"><label class="lbl">Image URL (optional)</label><input id="pimg" placeholder="https://..."/><div class="hint">Paste a direct link to an image</div></div>
        <div id="pe" class="err-box" style="display:none"></div>
        <button class="btn btn-p btn-f" id="submitPost" style="font-size:14px;padding:12px">🚀 Publish Post</button>
      </div>
    </div>`;

  document.getElementById('payNow')?.addEventListener('click',()=>{
    openPayModal(amount,async()=>{
      await set(ref(db,`payments/${currentUser.uid}`),{amount,created:new Date().toISOString(),expires:new Date(Date.now()+864e5).toISOString()});
      toast('Payment confirmed! You can now post 🎉','ok');renderPost(document.getElementById('app'));
    });
  });

  document.getElementById('submitPost')?.addEventListener('click',async()=>{
    const title=document.getElementById('ptitle').value.trim();
    const desc=document.getElementById('pdesc').value.trim();
    const contact=document.getElementById('pcontact').value.trim();
    const pe=document.getElementById('pe');pe.style.display='none';
    if(!title||!desc||!contact){pe.textContent='Please fill in Title, Description and Contact.';pe.style.display='block';return;}
    const btn=document.getElementById('submitPost');btn.disabled=true;btn.textContent='Publishing...';
    try{
      await push(ref(db,'posts'),{
        type:document.getElementById('pt').value,category:document.getElementById('pc').value,
        title,desc,price:document.getElementById('pprice').value.trim(),
        contact,img:document.getElementById('pimg').value.trim(),

        likes:{},comments:{},views:0,created:new Date().toISOString()

  });
}

  app.innerHTML=`
    <div class="auth-page" style="align-items:flex-start;padding-top:20px">

        <h2>Join Maseno eShop 🛒</h2>

          <div class="fg"><label class="lbl">Service Areas</label><input id="ra" placeholder="e.g. Maseno Campus, Lwak, Kombewa..." maxlength="200"/></div>
          <div class="fg" style="margin-bottom:0"><label class="lbl">Your Pricing</label><textarea id="rpr" style="height:65px;resize:none" placeholder="e.g. Shirts: KES 20, Trousers: KES 30..." maxlength="300"></textarea></div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <div class="fg"><label class="lbl">Password *</label><input id="rpw" type="password" placeholder="Min 8 characters" autocomplete="new-password"/></div>
          <div class="fg"><label class="lbl">Confirm *</label><input id="rpc" type="password" placeholder="Repeat password" autocomplete="new-password"/></div>
        </div>
        <div class="hint" style="margin:-10px 0 14px">Must include uppercase, lowercase & a number</div>
        <div id="rerr" class="err-box" style="display:none"></div>
        <button class="btn btn-p btn-f" id="rBtn" style="font-size:14px;padding:12px">Create Account</button>
        <div class="auth-sw">Already have an account? <span onclick="go('login')">Login</span></div>

    const name=document.getElementById('rn').value.trim(),email=document.getElementById('re').value.trim();
    const phone=document.getElementById('rph').value.trim(),role=document.getElementById('rr').value;
    const pw=document.getElementById('rpw').value,pc=document.getElementById('rpc').value;

        'auth/invalid-email':'Invalid email address.',
      }[e.code]||e.message;
      err.style.display='block';btn.disabled=false;btn.textContent='Create Account';
    }
  };

async function renderProfile(app) {
  if(!currentUser){go('login');return;}
  app.innerHTML='<div class="loader"></div>';
  const userSnap=await get(ref(db,`users/${currentUser.uid}`));
  const u=userSnap.val()||{};
  const isMf=u.role==='mama_fua';
  let activeTab='edit';

  async function draw(){
    const postsSnap=await get(ref(db,'posts'));
    const allPosts=postsSnap.val()||{};
    const myPosts=Object.entries(allPosts).filter(([,p])=>p.authorId===currentUser.uid).map(([id,p])=>({...p,id})).reverse();

    app.innerHTML=`
      <div class="page">
        <div class="prof-head">
          <div class="prof-av">${ini(u.name||currentUser.email)}</div>
          <div>
            <span class="badge b-${u.role}" style="margin-bottom:6px;display:inline-block">${{student:'🎓 Student',business:'🏢 Business',mama_fua:'🧺 Mama Fua',admin:'⚡ Admin'}[u.role]||u.role}</span>
            <div style="font-family:var(--fd);font-size:20px;font-weight:900;letter-spacing:-.02em">${u.name||''}</div>
            <div style="font-size:11px;color:var(--t2);margin-top:3px">📧 ${u.email||''} · 📱 ${u.phone||''}</div>
            <div style="font-size:10px;color:var(--t3);margin-top:2px">Member since ${new Date(u.created||Date.now()).toLocaleDateString('en-KE',{month:'long',year:'numeric'})}</div>
          </div>
        </div>

        ${isMf?`<div class="avail-row">
          <div>
            <div style="font-weight:600;font-size:13px">Available Today</div>
            <div style="font-size:11px;color:var(--t2);margin-top:2px">${u.mf?.isAvail?'✅ Customers can find and contact you':'❌ Currently marked as unavailable'}</div>
          </div>
          <div class="toggle ${u.mf?.isAvail?'on':''}" id="avTog"></div>
        </div>`:''}

        <div class="tabs-bar">
          <div class="tab ${activeTab==='edit'?'active':''}" data-t="edit">Edit Profile</div>
          <div class="tab ${activeTab==='posts'?'active':''}" data-t="posts">My Posts (${myPosts.length})</div>
          ${isMf?`<div class="tab ${activeTab==='mf'?'active':''}" data-t="mf">Mama Fua Profile</div>`:''}
        </div>

        <div id="tabContent">
          ${activeTab==='edit'?`
            <div class="fg"><label class="lbl">Full Name</label><input id="pn" value="${u.name||''}" maxlength="80"/></div>
            <div class="fg"><label class="lbl">Bio</label><textarea id="pb" style="height:80px;resize:none" maxlength="300" placeholder="Tell the community about yourself...">${u.bio||''}</textarea></div>
            <div style="display:flex;gap:8px;flex-wrap:wrap">
              <button class="btn btn-p" id="saveP">Save Changes</button>
              <button class="btn btn-g" id="logoutP">Logout</button>
            </div>`:''}
          ${activeTab==='posts'?`
            <div style="display:flex;flex-direction:column;gap:8px">
              ${myPosts.length?myPosts.map(p=>`
                <div class="card" style="display:flex;gap:10px;align-items:center;cursor:pointer;padding:12px" onclick="_detailId='${p.id}';go('detail')">
                  <div style="width:52px;height:52px;border-radius:var(--rs);background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex-shrink:0;overflow:hidden">${p.img?`<img src="${p.img}" style="width:100%;height:100%;object-fit:cover" onerror="this.parentElement.innerHTML='${emo[p.category]||'📦'}'"/>`:emo[p.category]||'📦'}</div>
                  <div style="flex:1;min-width:0">
                    <div style="font-weight:600;font-size:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${p.title||''}</div>
                    <div style="font-size:11px;color:var(--t3);margin-top:3px">${ago(p.created)} · ♥ ${p.likes?Object.keys(p.likes).length:0} · 💬 ${p.comments?Object.keys(p.comments).length:0}</div>
                  </div>
                  <span class="badge b-${p.type}" style="font-size:9px;flex-shrink:0">${p.type}</span>
                </div>`).join(''):`<div class="empty"><div class="empty-icon">📭</div><h3>No posts yet</h3><p><span style="color:var(--gll);cursor:pointer" onclick="go('post')">Create your first ad →</span></p></div>`}
            </div>`:''}
          ${activeTab==='mf'&&isMf?`
            <div class="fg"><label class="lbl">Service Areas</label><input id="mfa" value="${u.mf?.areas||''}" placeholder="e.g. Maseno Campus, Lwak..."/></div>
            <div class="fg"><label class="lbl">Pricing Info</label><textarea id="mfp" style="height:80px;resize:none" placeholder="e.g. Shirts KES 20, Trousers KES 30...">${u.mf?.pricing||''}</textarea></div>

    document.querySelectorAll('[data-t]').forEach(t=>t.onclick=()=>{activeTab=t.dataset.t;draw();});

    document.getElementById('avTog')?.addEventListener('click',async()=>{
      const newVal=!u.mf?.isAvail;
      await update(ref(db,`users/${currentUser.uid}/mf`),{isAvail:newVal});
      u.mf=u.mf||{};u.mf.isAvail=newVal;
      toast(newVal?'✅ You are now Available Today!':'👋 Marked as Unavailable','ok');draw();
    });
    document.getElementById('saveP')?.addEventListener('click',async()=>{
      const btn=document.getElementById('saveP');btn.disabled=true;btn.textContent='Saving...';
      const name=document.getElementById('pn').value.trim()||u.name;
      const bio=document.getElementById('pb').value.trim();
      await update(ref(db,`users/${currentUser.uid}`),{name,bio});
      await updateProfile(currentUser,{displayName:name});
      u.name=name;u.bio=bio;
      toast('Profile updated ✅','ok');btn.disabled=false;btn.textContent='Save Changes';
    });
    document.getElementById('logoutP')?.addEventListener('click',async()=>{
      await signOut(auth);updateNav();toast('Logged out','inf');go('feed');
    });
    document.getElementById('saveMf')?.addEventListener('click',async()=>{
      const btn=document.getElementById('saveMf');btn.disabled=true;btn.textContent='Saving...';
      const areas=document.getElementById('mfa').value;
      const pricing=document.getElementById('mfp').value;
      await update(ref(db,`users/${currentUser.uid}/mf`),{areas,pricing});
      u.mf=u.mf||{};u.mf.areas=areas;u.mf.pricing=pricing;
      toast('Mama Fua profile updated ✅','ok');btn.disabled=false;btn.textContent='Save Mama Fua Profile';
    });
  }
  draw();
}
